[package]
name = "pumpkin-api-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
syn .workspace = true
quote.workspace = true
proc-macro2.workspace = true
proc-macro-error2.workspace = true

[dev-dependencies]
# Renamed so the `pumpkin::plugin::…` paths generated by `plugin_impl` resolve;
# `crates/pumpkin` lost its lib target in the core split.
pumpkin = { path = "../pumpkin-core", package = "pumpkin-core" }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

[lints]
workspace = true
